
services:
  - type: web
    name: mailroom-agent
    runtime: python
    buildCommand: pip install uv && uv sync --no-dev
    startCommand: uv run uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: mailroom-data
      mountPath: /var/data
      sizeGB: 1
